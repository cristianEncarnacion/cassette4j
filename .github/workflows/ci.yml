name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp verify

  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build sources and javadoc jars like a real release (without signing)
        run: mvn -B -ntp -P release -Dgpg.skip verify

  example-quarkus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install cassette4j locally
        run: mvn -B -ntp install -DskipTests
      - name: Quarkus + LangChain4j example (replays a committed cassette, no API key)
        run: mvn -B -ntp -f examples/quarkus-langchain4j verify
      - name: Show cassette4j mismatch details
        if: failure()
        run: |
          grep -rhE "cassette4j|recorded:|actual:|request:" examples/quarkus-langchain4j/target/surefire-reports/ 2>/dev/null \
            | head -40 | while IFS= read -r line; do echo "::warning::${line}"; done || true
